name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # The default GITHUB_TOKEN can't create pull requests on this repo ("GitHub Actions is
          # not permitted to create or approve pull requests" — a repo/org setting, off by
          # default). A fine-grained PAT (Contents: read/write, Pull requests: read/write) stored
          # as this secret is used instead.
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
