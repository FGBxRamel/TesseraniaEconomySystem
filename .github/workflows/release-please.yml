name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # TODO: if branch protection on main requires status checks/reviews that block the
          # default GITHUB_TOKEN from pushing/merging the release PR branch, swap in a PAT
          # stored as e.g. secrets.RELEASE_PLEASE_PAT instead.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
