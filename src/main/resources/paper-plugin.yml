name: TES
description: $description
version: '${version}'

main: de.bydora.tes.TesseraniaEconomySystem
bootstrapper: de.bydora.tes.TesBootstrap
api-version: '26.2'
load: STARTUP

authors: [ FGBxRamel ]

# Commands are registered as a Brigadier command tree in TesBootstrap during the plugin
# bootstrap phase, not declared here — Paper plugins do not support YAML-based command
# declarations.
permissions:
  tes.admin.spieler.add:
    description: Erlaubt das Hinzufügen eines Spielers zum Belohnungssystem
    default: op
  tes.admin.spieler.remove:
    description: Erlaubt das endgültige Entfernen eines Spielers inkl. aller Daten
    default: op
  tes.admin.spieler.pause:
    description: Erlaubt das Pausieren eines Spielers im Belohnungssystem
    default: op
  tes.admin.spieler.unpause:
    description: Erlaubt das Entpausieren eines Spielers
    default: op
  tes.admin.treuepunkte.add:
    description: Erlaubt das Hinzufügen von Treuepunkten bei einem Spieler
    default: op
  tes.admin.treuepunkte.remove:
    description: Erlaubt das Abziehen von Treuepunkten bei einem Spieler
    default: op
  tes.admin.treuepunkte.set:
    description: Erlaubt das Festsetzen des Treuepunktestands eines Spielers
    default: op
  tes.admin.erfahrungspunkte.add:
    description: Erlaubt das Hinzufügen von Erfahrungspunkten bei einem Spieler
    default: op
  tes.admin.erfahrungspunkte.remove:
    description: Erlaubt das Abziehen von Erfahrungspunkten bei einem Spieler
    default: op
  tes.admin.erfahrungspunkte.set:
    description: Erlaubt das Festsetzen des Erfahrungspunktestands eines Spielers
    default: op
  tes.shop.create:
    description: Erlaubt das Erstellen eines neuen Item-Shops
    default: true
  tes.shop.edit:
    description: Erlaubt das Bearbeiten eigener Item-Shops
    default: true
  tes.shop.close:
    description: Erlaubt das Schließen eigener Item-Shops
    default: true
  tes.shop.list:
    description: Erlaubt das Auflisten eigener Item-Shops
    default: true
