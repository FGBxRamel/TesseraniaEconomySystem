ratios:
  taler-to-tp: 5
  taler-to-ep: 3

shops:
  # Welten, in denen keine Shops erstellt werden dürfen (§3.1.1.1: nicht in der Kreativwelt).
  restricted-worlds:
    - kreativwelt
  # Wie nah ein Besitzer an seinem Shop stehen muss, um ihn zu schließen.
  proximity-blocks: 10
  # Wie lange eine Shop-Erstellung/-Bearbeitung im Chat auf Eingaben wartet, bevor sie verfällt.
  session-timeout-seconds: 120

treueshop:
  # Treuepunkte-Kosten der Belohnungen im Treuepunkteshop (§3.2.1.1), abgeglichen mit dem
  # Referenzaufbau in der Kreativwelt. Belohnungen ohne eigene Kosten (öffnen nur ein Untermenü)
  # sind hier nicht aufgeführt.
  rewards:
    prozessverstaerker: { cost: 25 }
    segen-der-zwerge: { cost: 100 }
    handelsbonus: { cost: 150 }
    erntewelt: { cost: 160 }
    glutzone: { cost: 160 }
    kraftelixier: { cost: 175 }
    spawner: { cost: 1000 }
    xp-boost-1: { cost: 50 }
    xp-boost-2: { cost: 75 }
    xp-boost-3: { cost: 100 }
    xp-boost-4: { cost: 125 }
    freundliche-mobs-1: { cost: 200 }
    freundliche-mobs-2: { cost: 200 }
    feindliche-mobs-1: { cost: 250 }
    feindliche-mobs-2: { cost: 275 }
  segen-der-zwerge:
    # Dauer des Eile-II-Effekts nach Kauf.
    haste-minutes: 30
  kraftelixier:
    # Dauer des Effektbündels (Regeneration II, Resistenz II, Stärke, Held des Dorfes) nach Kauf.
    effect-minutes: 30
  prozessverstaerker:
    # Dauer eines einzelnen Boosts (Ofen 2x Geschwindigkeit / Bienenstock 2x Honigproduktion).
    # Mehrfache Nutzung auf demselben Block addiert diese Dauer zur verbleibenden Zeit.
    boost-minutes: 15
  handelsbonus:
    # Wie viele Diamanten Rabatt eine Aktivierung insgesamt gewährt.
    discount-diamonds: 5
    # Zufällige Cooldown-Spanne (in Tagen) bis dieselbe Belohnung erneut ausgelöst werden kann.
    cooldown-min-days: 21
    cooldown-max-days: 28
    staatskasse:
      # Truhe, aus der die Rabatt-Diamanten entnommen werden. Leer/unkonfiguriert lassen bedeutet:
      # Handelsbonus ist kaufbar, gewährt aber noch keinen Rabatt, bis eine Welt gesetzt ist.
      world: ""
      x: 0
      y: 0
      z: 0
